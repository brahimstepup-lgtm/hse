name: Android Safety Tags

on:
  push:
    branches: [android-safety-tags]
    paths: ['android-safety-tags/**', '.github/workflows/android-safety-tags.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: android-safety-tags
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug bundleRelease --no-daemon --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SafetyTags-apk
          path: android-safety-tags/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish result on branch android-build
        if: always()
        shell: bash
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || echo "no log" > out/build.log
          cp android-safety-tags/app/build/outputs/apk/debug/app-debug.apk out/SafetyTags.apk 2>/dev/null || true
          cp android-safety-tags/app/build/outputs/bundle/release/app-release.aab out/SafetyTags-release-unsigned.aab 2>/dev/null || true
          echo "${GITHUB_SHA} ${{ job.status }}" > out/STATUS
          cd out
          git init -q
          git checkout -q -b android-build
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-build
